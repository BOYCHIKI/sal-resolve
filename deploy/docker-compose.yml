# SAL on one server: PostgreSQL, the API, the worker, the web and Caddy for HTTPS.
#   cp deploy/.env.example deploy/.env    # fill it in (secrets stay on the server)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Only Caddy is published (80 and 443). The database, the API and the web are reachable inside this network only.
name: sal

x-api: &api
  build: { context: .., dockerfile: deploy/api.Dockerfile }
  env_file: .env
  environment:
    SAL_ENV: prod
    SAL_APP_DATABASE_URL: postgresql+psycopg://sal_app:${SAL_APP_PASSWORD}@db:5432/sal
    SAL_WORKER_DATABASE_URL: postgresql+psycopg://sal_worker:${SAL_WORKER_PASSWORD}@db:5432/sal
    SAL_MIGRATOR_DATABASE_URL: postgresql+psycopg://sal_migrator:${SAL_MIGRATOR_PASSWORD}@db:5432/sal
  volumes:
    - storage:/data/storage
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      SAL_MIGRATOR_PASSWORD: ${SAL_MIGRATOR_PASSWORD}
      SAL_APP_PASSWORD: ${SAL_APP_PASSWORD}
      SAL_WORKER_PASSWORD: ${SAL_WORKER_PASSWORD}
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sal"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  migrate:
    <<: *api
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    depends_on: { db: { condition: service_healthy } }

  api:
    <<: *api
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker:
    <<: *api
    command: ["python", "-m", "app.worker"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  web:
    build: { context: .., dockerfile: deploy/web.Dockerfile }
    environment:
      SAL_API_URL: http://api:8000
      SAL_INTERNAL_TOKEN: ${SAL_INTERNAL_TOKEN}
    depends_on: [api]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      SAL_DOMAIN: ${SAL_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, api]
    restart: unless-stopped

volumes:
  pgdata:
  storage:
  caddy_data:
