# Runs every test on every push and pull request. No secrets: PayPal and OpenAI are faked in tests.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_only
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - name: Create roles and databases (same scripts as docker compose)
        env:
          PGPASSWORD: postgres_dev_only
        run: |
          for f in apps/api/db/init/*.sql; do psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 15432 -U postgres -d postgres -f "$f"; done
      - run: pip install -r apps/api/requirements.lock
      - name: Tests (sal_test database)
        working-directory: apps/api
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
